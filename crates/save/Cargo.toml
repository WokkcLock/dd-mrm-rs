[package]
name = "save"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Save discovery, mod scanning, offline apply and zip backup for Darkest Dungeon saves"

[dependencies]
dson = { path = "../dson" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
