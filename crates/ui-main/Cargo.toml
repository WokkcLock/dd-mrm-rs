[package]
name = "ui-main"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "dd-mrm: slint-based Darkest Dungeon mod manager GUI"

[dependencies]
save = { path = "../save" }
hotapply = { path = "../hotapply" }
# slint 1.x 稳定线（许可决定留给发布期，见任务 5 报告）。
slint = "1.18.1"
# 配置文件 dd-mrm.json 序列化（roots + presets_path 包裹层）。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 原生目录选择器（设置面板“浏览…”；同步 API，仅 Windows 路径，default-features=false
# 免掉 Linux gtk 依赖 —— 本工具 Windows-only，见简报 ruling 1/5）。
rfd = { version = "0.15", default-features = false }
# 缩略图按内容嗅探解码（工坊 preview_icon.png 常见 jpeg/webp 冒名 .png，
# slint load_from_path 按扩展名选解码器会失败；版本与 slint 内部 image 对齐 0.25.x）。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }

[build-dependencies]
slint-build = "1.18.1"

# 启动时读逻辑工作区收窄默认窗口尺寸（方案 A，用户 2026-11-05 选定）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

# 产物名保持 dd-mrm.exe（部署约定：exe 旁的 dd-mrm.json / SaveBak / logs 与启动脚本都按它寻址）。
[[bin]]
name = "dd-mrm"
path = "src/main.rs"
