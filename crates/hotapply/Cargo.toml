[package]
name = "hotapply"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "DdHotapply.dll injector and size-guard deployment (cfg v8 shared memory) for in-game save hot-apply"

# GC1: 独立 crate —— 不得依赖 dson / save。v14 退役管道客户端时
# serde/serde_json 随之失去使用方，已删；现无普通依赖。
# DLL 参数权威 = native/DdHotapply.c（C DLL 保持不重写，GC2）。
# 特性清单 = injector/hook 实际用到的七项（进程枚举 ToolHelp、写内存
# Diagnostics_Debug、取址 LibraryLoader、线程 Threading、内存 Memory、Foundation，
# 以及 Security —— CreateRemoteThread/CreateFileMappingW 签名含 SECURITY_ATTRIBUTES，
# windows 0.62 把它们整个门控在该 feature 后，非显式 import 也必需）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
] }
